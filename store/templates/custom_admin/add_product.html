{% extends 'base.html' %}
{% load static %}
{% block title %}إضافة منتج جديد | لوحة التحكم{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 700px;">
    <div class="card shadow-sm p-4 rounded-4">
        <h2 class="mb-4 text-success fw-bold">إضافة منتج عشبي جديد</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">حفظ المنتج</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{% url 'admin_dashboard' %}" class="text-muted text-decoration-none">← العودة إلى لوحة التحكم</a>
        </div>
    </div>
</div>
{% endblock %}
