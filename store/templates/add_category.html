{% extends 'base.html' %}
{% block title %}إضافة تصنيف جديد | لوحة التحكم{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h2 class="mb-4 fw-bold text-success">إضافة تصنيف جديد</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-3">حفظ التصنيف</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{% url 'admin_dashboard' %}" class="text-muted text-decoration-none">العودة إلى لوحة التحكم</a>
        </div>
    </div>
</div>
{% endblock %}
