{% extends 'base.html' %}
{% block title %}استعادة كلمة المرور | زاد للمنتجات العشبية{% endblock %}
{% block content %}
<div class="container my-5 py-4" style="max-width: 500px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h3 class="fw-bold text-success mb-3 text-center">استعادة كلمة المرور</h3>
        <p class="text-muted small text-center mb-4">أدخل بريدك الإلكتروني وسنرسل لك تعليمات إعادة تعيين كلمة المرور.</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">إرسال رابط الاستعادة</button>
        </form>
    </div>
</div>
{% endblock %}
